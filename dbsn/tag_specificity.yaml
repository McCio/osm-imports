# Tag specificity rankings for DBSN conflation.
# For each OSM key, values are listed from most generic (index 0) to most specific (last).
# When DBSN and OSM disagree on a key: the higher-index value wins.
# When both values are at the same index (or neither is listed): conflict → note= tag.
#
# Add new entries here when the pipeline encounters unlisted values.

