# Numeric parameters for DBSN conflation.
# Layered: defaults → regions → provinces. CLI flags override all.
#
# centroid_distance_m: max centroid-to-centroid distance (metres) for candidate pairs
# iou_threshold:       min intersection-over-union ratio to confirm a match (0–1)
# near_miss_iou:       pairs with IoU in [near_miss_iou, iou_threshold) go to _ambiguous for review
# offset_min_matches:  minimum matched pairs needed before attempting offset detection
# offset_min_m:        minimum detected offset (metres) before shifting and re-running
# identical_iou:       IoU above which a no-tag-change match is "identical" and dropped
#                      from _conflated.osm (keep via --review-identical)
# shape_extra_distance_m: shape-signature second chance gate, in percent of feature
#                      size (sqrt of area): 100 = centroid may drift up to 1× building
#                      size, 0 = disabled. Scales with feature size — small-shed
#                      coincidences 200 m away stay out, large-feature drift stays in.
#                      Same area/perimeter/vertex count, no overlap → ambiguous as
#                      shape_match, suggest=replace
# shape_area_tolerance / shape_perimeter_tolerance: relative tolerance (0–1)
# shape_vertex_ratio:  max ratio of exterior vertex counts (cadastral detail vs
#                      simplified hand-traced)
# block_buffer_m:      buffer distance (metres) joining nearby features into one
#                      spatial block (connected components of buffered geoms)
# greenfield_min_new:  block needs at least this many new (DBSN-only) features to
#                      qualify as greenfield — kills noise blocks
# greenfield_max_other_ratio: matched+osm_only+ambiguous as fraction of new must
#                      stay at or below this — tolerates few conflicts at scale
#                      (200 new + 6 matched = 3% passes; 12 new + 1 matched = 8% fails)
#
# Per-region or per-province overrides:
#   regions:
#     Veneto:
#       centroid_distance_m: 150
#   provinces:
#     PD:
#       iou_threshold: 0.25
#
# legacy_imports: changeset-level detection of old regional-import features.
# The element's changeset (fetched from OSM API, cached in _changesets.json) must
# match a pattern. Overlapping any DBSN feature → auto-replace in _changes.osc;
# no overlap → suggested delete (.osc delete + _ambiguous.osm entry).
# Patterns are regex (re.search). Layers append (region → province → area):
#   legacy_imports:
#     patterns:                     # global
#       - changeset_source: 'Regione Veneto, License IODL-2.0'
#     regions:
#       Veneto:
#         patterns: [...]
#     provinces:
#       VE:
#         patterns: [...]
#     areas:                        # comune level, keyed by area slug
#       marghera:
#         patterns: [...]

defaults:
  centroid_distance_m: 100
  iou_threshold: 0.3
  near_miss_iou: 0.05
  offset_min_matches: 20
  offset_min_m: 5.0
  identical_iou: 0.95
  shape_extra_distance_m: 100
  block_buffer_m: 50
  greenfield_min_new: 10
  greenfield_max_other_ratio: 0.05

legacy_imports:
  regions:
    Veneto:
      patterns:
        - changeset_source: 'Regione Veneto, License IODL-2\.0'

regions: {}

provinces: {}
