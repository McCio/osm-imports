[project]
name = "osm-imports"
version = "0.1.0"
description = "Data preparation tools for Italian geographic datasets into OSM format"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "beautifulsoup4>=4.15",
    "fiona>=1.10",      # ships bundled GDAL+PROJ wheels; no system GDAL needed
    "osmium>=4.3.1",
    "pyproj>=3.7.2",
    # iccu pipeline
    "polars[pyarrow]>=1.12.0,<2",
    "pandas[xml]>=3.0,<4",
    "osm-conflate @ git+https://github.com/McCio/osm_conflate@v1.6.1",
    "phonenumberslite>=9.0,<10",
]

[project.scripts]
dbsn-discover    = "dbsn.discover:main"
dbsn-download    = "dbsn.download:main"
dbsn-extract     = "dbsn.extract:main"
dbsn-convert     = "dbsn.convert:main"
dbsn-validate    = "dbsn.validate:main"
dbsn-all         = "dbsn.pipeline:main"
dbsn-list-codes  = "dbsn.list_codes:main"
iccu-download    = "iccu.download:main"
iccu-clean       = "iccu.clean:main"
iccu-export      = "iccu.export:main"
iccu-conflate    = "iccu.conflate:main"
iccu-all         = "iccu.pipeline:main"

[dependency-groups]
dev = ["ruff>=0.4", "pandas-stubs~=3.0.3"]

[tool.ruff]
target-version = "py313"
line-length = 120
include = ["dbsn/**/*.py", "iccu/**/*.py", "utils/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "SIM", "PTH", "PLC0415"]

[tool.hatch.build.targets.wheel]
packages = ["dbsn", "iccu", "utils"]

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
