name: DBSN Pipeline
run-name: "DBSN — ${{ inputs.province }}"

on:
  workflow_dispatch:
    inputs:
      province:
        description: 'Province code/name/region or "all"; comma-separated for multiple'
        required: true
        default: all
      discover:
        description: 'Fetch latest DBSN links from IGM (leave false to reuse committed sources.json)'
        type: boolean
        required: false
        default: false
      overwrite:
        description: 'Reprocess and re-upload already released files'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    env:
      PROVINCE: ${{ inputs.province }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run discover
        if: ${{ inputs.discover }}
        run: uv run dbsn-discover

      - name: Commit sources.json if changed
        if: ${{ inputs.discover }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/dbsn/sources.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(discover): update sources.json [skip ci]"
            git push origin HEAD
          fi

      - name: Compute release tag
        run: |
          DATE=$(uv run dbsn-max-date)
          echo "DBSN_TAG=dbsn-${DATE}" >> $GITHUB_ENV
          echo "DBSN_DATE=${DATE}" >> $GITHUB_ENV

      - name: Create release if needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$DBSN_TAG" &>/dev/null; then
            gh release create "$DBSN_TAG" \
              --title "DBSN Buildings $DBSN_DATE" \
              --notes "DBSN building footprints (OSM XML), version $DBSN_DATE" \
              --latest=false
          fi

      - name: Restore ext FGB cache
        uses: actions/cache/restore@v6
        with:
          path: data/dbsn/buildings
          key: dbsn-ext-${{ github.run_id }}
          restore-keys: dbsn-ext-

      - name: Restore data from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/dbsn/zips data/dbsn/buildings data/dbsn/osm
          if [[ "${{ inputs.overwrite }}" != "true" ]]; then
            for code in $(uv run dbsn-list-codes --province "$PROVINCE"); do
              gh release download "$DBSN_TAG" --dir data/dbsn/zips      --pattern "${code}_*.zip"     || true
              gh release download "$DBSN_TAG" --dir data/dbsn/buildings --pattern "${code}_*.fgb"     || true
              gh release download "$DBSN_TAG" --dir data/dbsn/osm       --pattern "${code}_*.osm.bz2" || true
            done
          fi

      - name: Run download
        run: uv run dbsn-download --province "$PROVINCE"

      - name: Run extract
        run: uv run dbsn-extract --province "$PROVINCE"

      - name: Run convert
        run: uv run dbsn-convert --province "$PROVINCE" --compress

      - name: Check for OSM output
        id: osm_check
        if: always()
        run: |
          count=$(find data/dbsn/osm -name '*.osm*' 2>/dev/null | wc -l | tr -d ' ')
          echo "found=$count" >> "$GITHUB_OUTPUT"

      - name: Install osmium-tool
        if: always() && steps.osm_check.outputs.found != '0'
        run: sudo apt-get install -y osmium-tool

      - name: Run validate
        if: always() && steps.osm_check.outputs.found != '0'
        run: uv run dbsn-validate --province "$PROVINCE" --delete-invalid

      - name: Save frontier to release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=$(gh release view "$DBSN_TAG" --json assets --jq '[.assets[].name]')
          for code in $(uv run dbsn-list-codes --province "$PROVINCE"); do
            shopt -s nullglob
            osm_files=(data/dbsn/osm/${code}_*.osm.bz2)
            # Exclude ext FGBs (pattern: CODE_CODE_date_date.fgb); raw FGBs only
            raw_fgb_files=()
            for f in data/dbsn/buildings/${code}_*.fgb; do
              [[ $(basename "$f") =~ ^[A-Z]{2}_[A-Z]{2}_ ]] || raw_fgb_files+=("$f")
            done
            zip_files=(data/dbsn/zips/${code}_*.zip)

            if [[ ${#osm_files[@]} -gt 0 ]]; then
              gh release upload "$DBSN_TAG" "${osm_files[@]}" --clobber
              uploaded_names=()
              for f in "${osm_files[@]}"; do uploaded_names+=("$(basename "$f")"); done
              for pat in "^${code}_.*[.]fgb$" "^${code}_.*[.]zip$" "^${code}_.*[.]osm$" "^${code}_.*[.]osm[.]bz2$"; do
                while IFS= read -r old; do
                  [[ -z "$old" ]] && continue
                  printf '%s\n' "${uploaded_names[@]}" | grep -qxF "$old" && continue
                  gh release delete-asset "$DBSN_TAG" "$old" --yes || true
                done < <(echo "$assets" | jq -r ".[] | select(test(\"$pat\"))")
              done
            elif [[ ${#raw_fgb_files[@]} -gt 0 ]]; then
              gh release upload "$DBSN_TAG" "${raw_fgb_files[@]}" --clobber
              while IFS= read -r old; do
                [[ -n "$old" ]] && gh release delete-asset "$DBSN_TAG" "$old" --yes || true
              done < <(echo "$assets" | jq -r ".[] | select(test(\"^${code}_.*[.]zip$\"))")
            elif [[ ${#zip_files[@]} -gt 0 ]]; then
              gh release upload "$DBSN_TAG" "${zip_files[@]}" --clobber
            fi
          done

      - name: Prune raw FGBs before caching
        if: always()
        run: |
          find data/dbsn/buildings -maxdepth 1 -name '*.fgb' | while read -r f; do
            [[ $(basename "$f") =~ ^[A-Z]{2}_[A-Z]{2}_ ]] || rm -f "$f"
          done

      - name: Save ext FGB cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: data/dbsn/buildings
          key: dbsn-ext-${{ github.run_id }}
