name: DBSN Pipeline

on:
  workflow_dispatch:
    inputs:
      province:
        description: 'Province code/name/region or "all"; comma-separated for multiple'
        required: true
        default: all
      discover:
        description: 'Fetch latest DBSN links from IGM (leave false to reuse committed sources.json)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    env:
      PROVINCE: ${{ inputs.province }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run discover
        if: ${{ inputs.discover }}
        run: uv run dbsn-discover

      - name: Commit sources.json if changed
        if: ${{ inputs.discover }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/dbsn/sources.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(discover): update sources.json [skip ci]"
            git push origin HEAD
          fi

      - name: Compute release tag
        run: |
          DATE=$(python -c "import json; d=json.load(open('data/dbsn/sources.json')); print(max(v['date'] for v in d.values()))")
          echo "DBSN_TAG=dbsn-${DATE}" >> $GITHUB_ENV
          echo "DBSN_DATE=${DATE}" >> $GITHUB_ENV

      - name: Create release if needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$DBSN_TAG" &>/dev/null; then
            gh release create "$DBSN_TAG" \
              --title "DBSN Buildings $DBSN_DATE" \
              --notes "DBSN building footprints (OSM XML), version $DBSN_DATE"
          fi

      - name: Restore data from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/dbsn/zips data/dbsn/buildings data/dbsn/osm
          for code in $(uv run dbsn-list-codes --province "$PROVINCE"); do
            gh release download "$DBSN_TAG" --dir data/dbsn/zips     --pattern "${code}_*.zip" || true
            gh release download "$DBSN_TAG" --dir data/dbsn/buildings --pattern "${code}_*.fgb" || true
            gh release download "$DBSN_TAG" --dir data/dbsn/osm      --pattern "${code}_*.osm.bz2" || true
          done

      - name: Run download
        run: uv run dbsn-download --province "$PROVINCE"

      - name: Run extract
        run: uv run dbsn-extract --province "$PROVINCE"

      - name: Run convert
        run: uv run dbsn-convert --province "$PROVINCE" --compress

      - name: Install osmium-tool
        run: sudo apt-get install -y osmium-tool

      - name: Run validate
        run: uv run dbsn-validate --province "$PROVINCE" --delete-invalid

      - name: Save frontier to release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=$(gh release view "$DBSN_TAG" --json assets --jq '[.assets[].name]')
          for code in $(uv run dbsn-list-codes --province "$PROVINCE"); do
            shopt -s nullglob
            osm_files=(data/dbsn/osm/${code}_*.osm.bz2)
            fgb_files=(data/dbsn/buildings/${code}_*.fgb)
            zip_files=(data/dbsn/zips/${code}_*.zip)

            if [[ ${#osm_files[@]} -gt 0 ]]; then
              gh release upload "$DBSN_TAG" "${osm_files[@]}" --clobber
              for pat in "^${code}_.*\.fgb$" "^${code}_.*\.zip$" "^${code}_.*\.osm$" "^${code}_.*\.osm\.bz2$"; do
                while IFS= read -r old; do
                  [[ -n "$old" ]] && gh release delete-asset "$DBSN_TAG" "$old" --yes || true
                done < <(echo "$assets" | jq -r ".[] | select(test(\"$pat\"))")
              done
            elif [[ ${#fgb_files[@]} -gt 0 ]]; then
              gh release upload "$DBSN_TAG" "${fgb_files[@]}" --clobber
              while IFS= read -r old; do
                [[ -n "$old" ]] && gh release delete-asset "$DBSN_TAG" "$old" --yes || true
              done < <(echo "$assets" | jq -r ".[] | select(test(\"^${code}_.*\.zip$\"))")
            elif [[ ${#zip_files[@]} -gt 0 ]]; then
              gh release upload "$DBSN_TAG" "${zip_files[@]}" --clobber
            fi
          done
